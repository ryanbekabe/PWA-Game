<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a16" />
      <stop offset="100%" stop-color="#181335" />
    </linearGradient>
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#0077fe" />
    </linearGradient>
    <linearGradient id="p2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#ff5500" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="92" fill="none" stroke="#252545" stroke-width="4" />

  <!-- Center Court Divider -->
  <line x1="256" y1="40" x2="256" y2="472" stroke="#3b3b6d" stroke-width="4" stroke-dasharray="14 14" opacity="0.6" />
  <circle cx="256" cy="256" r="64" fill="none" stroke="#3b3b6d" stroke-width="4" opacity="0.6" />

  <!-- Player 1 Neon Paddle -->
  <rect x="60" y="180" width="24" height="152" rx="12" fill="url(#p1Grad)" filter="url(#glow)" />
  <!-- Player 2 Neon Paddle -->
  <rect x="428" y="180" width="24" height="152" rx="12" fill="url(#p2Grad)" filter="url(#glow)" />

  <!-- Glowing Energy Ball with Trail -->
  <path d="M 120 220 Q 200 270 290 240" fill="none" stroke="#00f5ff" stroke-width="6" opacity="0.4" stroke-linecap="round" />
  <circle cx="300" cy="238" r="22" fill="#ffffff" filter="url(#glow)" />
  <circle cx="300" cy="238" r="16" fill="#ffe600" />
  
  <!-- TV & Phone symbols -->
  <g transform="translate(256, 380)" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="4">
    <text y="0">CYBER PONG</text>
    <text y="32" font-size="14" fill="#00f5ff" letter-spacing="6">TV &amp; MOBILE ARENA</text>
  </g>
</svg>
